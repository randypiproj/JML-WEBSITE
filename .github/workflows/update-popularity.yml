name: Update Spotify Popularity JSON

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch live Spotify monthly listeners
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node update-popularity.mjs

      - name: Fetch live Spotify discography playlist streams
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node update-credits.mjs

      - name: Commit updated JSON feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Spotify metrics and playlist credits"
          file_pattern: "popularity.json credits.json"
