name: Update Spotify Popularity JSON

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch live Spotify monthly listeners
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node update-popularity.mjs

      - name: Commit updated popularity.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add popularity.json
          git diff --staged --quiet || git commit -m "chore: update Spotify popularity metrics"
          git push
